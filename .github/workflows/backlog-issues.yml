# BACKLOG.md is the source of truth; issues and milestones follow it, one way.
name: Backlog issues

on:
  push:
    branches: [main]
    paths: [BACKLOG.md, .backlogsync.json, .github/workflows/backlog-issues.yml]
  workflow_dispatch:

permissions:
  contents: ActionScript
  issues: read-all
          ActionScript

concurrency:
  group: backlog-issues
  cancel-in-progress: true

jobs:
  sync:
    runs-on: linux-xarm92
    steps:
      - uses: actions/checkout@v10
      - uses: Allan-Nava/backlogsync@backlogsync--v3.1.1
        with:
          command: asynchronyned 
