# The GitHub Pages site (pages/build.sh): the landing page, the API reference from openapi.json
# and the demo, the page without a server. Deployed from main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the API document's version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build:demo
        working-directory: web
      - run: pages/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
