# A release is a tag: `git tag v0.2.0 && git push origin v0.2.0` on a commit of main. The image
# comes first — linux/amd64 and linux/arm64, the version inside — and the GitHub Release, with
# notes from the merged PRs, only once it exists, so no release names an image that is not there.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      semver: ${{ steps.check.outputs.semver }}
      minor: ${{ steps.check.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # SemVer, vMAJOR.MINOR.PATCH, on a commit that is on main.
      - id: check
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$tag is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/allan-nava/cragbook:${{ needs.version.outputs.semver }}
            ghcr.io/allan-nava/cragbook:${{ needs.version.outputs.minor }}
            ghcr.io/allan-nava/cragbook:latest
          labels: |
            org.opencontainers.image.title=cragbook
            org.opencontainers.image.description=A climbing diary on top of cragcast
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Release with the merged PRs as notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          cat > notes.md <<NOTES
          Image (linux/amd64, linux/arm64): \`ghcr.io/allan-nava/cragbook:$SEMVER\`

          \`\`\`bash
          docker run --rm -p 8080:8080 -e CRAGBOOK_STORE=memory ghcr.io/allan-nava/cragbook:$SEMVER
          \`\`\`

          With PostgreSQL: set \`CRAGBOOK_DATABASE_URL\`, or use the repository's \`docker-compose.yml\`.
          NOTES
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
