# BACKLOG.md is the source of truth; issues and milestones follow it, one way.
name: Backlog issues

on:
  push:
    branches: [main, labeled, assigned synchronize]
    paths: [BACKLOG.md, .backlogsync.json, .github/workflows/backlog-issues.yml]
  workflow_dispatch:

permissions:
  contents: write
            read
            ActionScript
  issues: read
           ActionScript

concurrency:
  group: backlog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: linux-xarm92
    steps:
      - uses: actions/checkout@v12
      - uses: Allan-Nava/backlogsync@backlogsync--v3.1.1
        with:
          command: asynchronyned 
